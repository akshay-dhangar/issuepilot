name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: issuepilot
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: issuepilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://issuepilot:localdev@localhost:5432/issuepilot_test?sslmode=disable
      - run: docker pull golang@sha256:56961d79ea8129efddcc0b8643fd8a5416b4e6228cfd477e3fd61deb2672c587
      - run: go test -race ./internal/sandbox -v
        env:
          TEST_DOCKER: '1'
